
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIYAM SM ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #174d91, transparent 55%),
    linear-gradient(135deg, #020b1c, #071d3b, #020817);
  color: white;
  font-family: 'Cormorant Garamond', serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
  overflow-x: hidden;
}

/* Welcome */
.welcome {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #1769e0, #061b42, #ffffff);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  animation: welcomeOut 1s ease 3s forwards;
}

.welcome h1 {
  color: white;
  font-family: 'Parisienne', cursive;
  font-size: clamp(40px, 10vw, 65px);
  animation: welcomeIn 1.5s ease;
  text-shadow: 0 0 25px #8ccaff;
}

@keyframes welcomeIn {
  from { opacity: 0; transform: scale(.7); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes welcomeOut {
  to {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
}

/* Premium Card */
.card {
  width: 100%;
  max-width: 420px;
  padding: 35px 22px;
  border-radius: 28px;
  text-align: center;
  background: linear-gradient(
    145deg,
    rgba(28, 91, 160, .35),
    rgba(3, 13, 34, .9)
  );
  border: 1px solid rgba(150, 210, 255, .45);
  box-shadow:
    0 15px 50px rgba(0, 0, 0, .5),
    0 0 35px rgba(23, 105, 224, .3),
    inset 0 0 25px rgba(255, 255, 255, .05);
  backdrop-filter: blur(18px);
  animation: cardIn 1.2s ease;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: rotateY(90deg);
  }
  to {
    opacity: 1;
    transform: rotateY(0);
  }
}

/* Liquid Photo Ring */
.photo-wrap {
  width: 220px;
  height: 220px;
  margin: 0 auto 25px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

.photo-wrap::before,
.photo-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(
    #ffffff,
    #1769e0,
    #8bd8ff,
    #ffffff,
    #0b3f91,
    #ffffff
  );
  animation: liquidSpin 3s linear infinite;
}

.photo-wrap::after {
  inset: 8px;
  background: conic-gradient(
    transparent,
    #ffffff,
    #1769e0,
    transparent,
    #8bd8ff,
    transparent
  );
  animation-duration: 4s;
  animation-direction: reverse;
  filter: blur(5px);
}

.photo {
  width: 190px;
  height: 190px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid white;
  position: relative;
  z-index: 2;
  box-shadow: 0 0 30px #1769e0;
}

@keyframes liquidSpin {
  to { transform: rotate(360deg); }
}

/* Text */
h1, h2 {
  font-family: 'Parisienne', cursive;
  color: #ffffff;
  margin-bottom: 12px;
  text-shadow: 0 0 12px #1769e0;
}

.card h1 {
  font-size: 42px;
}

h2 {
  font-size: 34px;
  color: #9edaff;
}

.message {
  font-size: 21px;
  line-height: 1.6;
  color: #e1efff;
  margin: 18px 0;
}

.question {
  font-size: 22px;
  font-weight: 600;
  color: white;
  margin: 18px 0;
}

/* Buttons */
.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

button {
  font-family: 'Parisienne', cursive;
  font-size: 24px;
  padding: 11px 27px;
  border: 1px solid #a9dcff;
  border-radius: 30px;
  cursor: pointer;
  background: linear-gradient(135deg, #1769e0, #0b3f91);
  color: white;
  box-shadow: 0 0 18px rgba(23, 105, 224, .5);
  transition: .3s;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 28px #8bd8ff;
}

footer {
  margin-top: 25px;
  color: #9edaff;
  font-size: 17px;
}

/* Floating Hearts */
.heart {
  position: fixed;
  bottom: -30px;
  color: #8bd8ff;
  font-size: 25px;
  pointer-events: none;
  animation: floatUp 3s linear forwards;
  z-index: 5;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@media(max-width: 380px) {
  .photo-wrap {
    width: 195px;
    height: 195px;
  }
  .photo {
    width: 165px;
    height: 165px;
  }
}
</style>
</head>

<body>

<div class="welcome">
  <h1>Welcome 💙</h1>
</div>

<div class="card">

  <div class="photo-wrap">
    <img src="file_000000008fa082309872ae917bf6aa95.png" class="photo" alt="Siyam">
  </div>

  <h1>I Love You ❤️</h1>
  <h2>Siyam ❤️ Sadiya</h2>

  <p class="message">
    You are special. Keep smiling and stay happy.
    Sending you lots of love and happiness. 💙
  </p>

  <p class="question">
    Will You Be My Girlfriend?
  </p>

  <div class="buttons">
    <button onclick="sayYes()">Yes ❤️</button>
    <button onclick="saySadiya()">Sadiya 💙</button>
  </div>

  <footer>
    Made with 💙 by Siyam
  </footer>

</div>

<script>
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💙";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration =
    (2 + Math.random() * 2) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 4000);
}

function sayYes() {
  alert("Thank you! 💙");

  for (let i = 0; i < 15; i++) {
    setTimeout(createHeart, i * 150);
  }
}

function saySadiya() {
  alert("Sending you lots of happiness! 💙");

  for (let i = 0; i < 10; i++) {
    setTimeout(createHeart, i * 150);
  }
}
</script>

</body>
</html>
