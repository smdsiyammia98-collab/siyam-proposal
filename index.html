<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siyam ❤️ Sadiya</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg,#d9eaff,#ffffff,#a9ceff);
  font-family: Arial,sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 380px;
  text-align: center;
}

#welcome {
  animation: welcome 2s ease;
  color: #0756ad;
}

#welcome h1 {
  font-size: 34px;
}

#welcome p {
  margin-top: 12px;
}

@keyframes welcome {
  from {opacity:0; transform:scale(.5);}
  to {opacity:1; transform:scale(1);}
}

.card {
  display: none;
  background: white;
  padding: 15px;
  border-radius: 25px;
  box-shadow: 0 15px 50px #0756ad40;
}

.card.show {
  display: block;
  animation: rotateCard 3s ease forwards;
}

@keyframes rotateCard {
  0% {
    opacity: 0;
    transform: perspective(900px) rotateY(0deg) scale(.3);
  }
  70% {
    opacity: 1;
    transform: perspective(900px) rotateY(720deg) scale(1.08);
  }
  100% {
    opacity: 1;
    transform: perspective(900px) rotateY(1080deg) scale(1);
  }
}

.photo {
  width: 100%;
  height: 320px;
  object-fit: cover;
  border-radius: 18px;
  border: 4px solid #c5e0ff;
}

h2 {
  color: #0756ad;
  margin-top: 18px;
  font-size: 27px;
}

.name {
  font-size: 23px;
  font-weight: bold;
  margin: 13px;
  color: #1769e0;
}

.message {
  color: #315b89;
  line-height: 1.8;
  font-size: 15px;
  padding: 8px;
}

.question {
  margin-top: 15px;
  color: #0756ad;
  font-size: 19px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

button {
  border: none;
  padding: 13px 23px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
}

.yes {
  background: #0875e1;
  color: white;
}

.sadiya {
  background: #e2efff;
  color: #0756ad;
}

#result {
  color: #0756ad;
  font-size: 20px;
  font-weight: bold;
  margin-top: 18px;
}

.heart {
  position: fixed;
  bottom: -30px;
  font-size: 25px;
  animation: float 4s linear forwards;
  pointer-events: none;
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

.footer {
  color: #4777aa;
  font-size: 12px;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

  <div id="welcome">
    <h1>💙 Welcome 💙</h1>
    <p>A Special Surprise For You</p>
  </div>

  <div class="card" id="card">

    <img src="siyam.jpg"
         class="photo"
         alt="Siyam">

    <h2>I Love You ❤️</h2>

    <div class="name">
      Siyam ❤️ Sadiya
    </div>

    <div class="message">
      You are the reason for my smile.<br>
      The peace in my heart.<br>
      And the happiness in my life.
    </div>

    <div class="question">
      Will You Be My Girlfriend?
    </div>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">
        Yes ❤️
      </button>

      <button class="sadiya" onclick="saySadiya()">
        Sadiya 💙
      </button>
    </div>

    <div id="result"></div>

  </div>

  <div class="footer">
    Made with 💙 by Siyam
  </div>

</div>

<script>
const welcome = document.getElementById("welcome");
const card = document.getElementById("card");

setTimeout(function() {
  welcome.style.display = "none";
  card.classList.add("show");
}, 3000);

function sayYes() {
  document.getElementById("result").innerHTML =
    "❤️ Yes! Thank You Sadiya ❤️";

  for(let i=0; i<35; i++) {
    createHeart();
  }
}

function saySadiya() {
  document.getElementById("result").innerHTML =
    "💙 Specially For Sadiya 💙";

  for(let i=0; i<15; i++) {
    createHeart();
  }
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💙";
  heart.style.left = Math.random()*100 + "vw";

  document.body.appendChild(heart);

  setTimeout(function() {
    heart.remove();
  },4000);
}
</script>

</body>
</html>
