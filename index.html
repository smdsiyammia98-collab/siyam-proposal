<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIYAM SM ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #eaf3ff, #ffffff);
  color: #17243a;
  font-family: 'Cormorant Garamond', serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow-x: hidden;
}

.welcome {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #1769e0, #0b3f91);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  animation: welcomeOut 1s ease 3s forwards;
}

.welcome h1 {
  color: white;
  font-family: 'Parisienne', cursive;
  font-size: clamp(40px, 10vw, 65px);
  animation: welcomeIn 1.5s ease;
}

@keyframes welcomeIn {
  from { opacity: 0; transform: scale(.7); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes welcomeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 30px 22px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 12px 35px rgba(23, 105, 224, .18);
  border: 1px solid #d8e8ff;
  animation: cardIn 1.2s ease;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: rotateY(90deg);
  }
  to {
    opacity: 1;
    transform: rotateY(0);
  }
}

.photo {
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 50%;
  border: 5px solid #1769e0;
  margin-bottom: 20px;
}

h1, h2 {
  font-family: 'Parisienne', cursive;
  color: #1769e0;
  margin-bottom: 12px;
}

h1 {
  font-size: 42px;
}

h2 {
  font-size: 34px;
}

.message {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  line-height: 1.6;
  color: #26364d;
  margin: 18px 0;
}

.question {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  margin: 18px 0;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

button {
  font-family: 'Parisienne', cursive;
  font-size: 24px;
  padding: 10px 25px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  background: #1769e0;
  color: white;
  transition: .3s;
}

button:hover {
  background: #0b3f91;
  transform: scale(1.06);
}

footer {
  margin-top: 25px;
  color: #1769e0;
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
}

.heart {
  position: fixed;
  bottom: -30px;
  color: #1769e0;
  font-size: 25px;
  pointer-events: none;
  animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="welcome">
  <h1>Welcome 💙</h1>
</div>

<div class="card">

  <img src="siam_style_1.png" class="photo" alt="Siyam">

  <h1>I Love You ❤️</h1>

  <h2>Siyam ❤️ Sadiya</h2>

  <p class="message">
    You are special. Keep smiling and stay happy.
    Sending you lots of love and happiness. 💙
  </p>

  <p class="question">
    Will You Be My Girlfriend?
  </p>

  <div class="buttons">
    <button onclick="sayYes()">Yes ❤️</button>
    <button onclick="saySadiya()">Sadiya 💙</button>
  </div>

  <footer>
    Made with 💙 by Siyam
  </footer>

</div>

<script>
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💙";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (2 + Math.random() * 2) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 4000);
}

function sayYes() {
  alert("Thank you! 💙");
  for (let i = 0; i < 15; i++) {
    setTimeout(createHeart, i * 150);
  }
}

function saySadiya() {
  alert("Sending you lots of happiness! 💙");
  for (let i = 0; i < 10; i++) {
    setTimeout(createHeart, i * 150);
  }
}
</script>

</body>
</html>
